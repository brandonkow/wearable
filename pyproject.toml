[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "band-usage"
version = "0.1.0"
description = "Show Claude Code & Codex usage on a Samsung Galaxy Fit 3 via ntfy notifications."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
band-usage = "band_usage.cli:main"

[tool.setuptools]
packages = ["band_usage"]
